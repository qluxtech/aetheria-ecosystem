[package]
name = "aetheria-daemon"
version = "0.1.0"
edition = "2021"
authors = ["AETHERIA Architecture <daemon@aetheria.org>"]
description = "Autonomous edge worker swarm driven by the AETHERIA core heartbeat."

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
colored = "2.1"
