[package]
name = "aetheria-core"
version = "0.1.0"
edition = "2021"
authors = ["AETHERIA Architecture <core@aetheria.org>"]
description = "The biological-rhythm heartbeat and autonomous swarm engine of AETHERIA."

[dependencies]
tokio = { version = "1.38", features = ["full"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
colored = "2.1"
