<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aetheria OS - Intent-to-Reality Matrix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000208;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 40%, rgba(168, 85, 247, 0.25) 0%, rgba(59, 130, 246, 0.1) 55%, transparent 80%);
            pointer-events: none;
            animation: cosmicBreathe 14s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes cosmicBreathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            40% { transform: translate(-50%, -50%) scale(1.12); opacity: 0.8; }
            70% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.4; }
        }

        .os-container {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            gap: 16px;
        }

        .header-container {
            text-align: center;
        }

        h1 {
            font-size: 1.3rem;
            letter-spacing: 0.35em;
            font-weight: 300;
            background: linear-gradient(135deg, #f5d0fe, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(168, 85, 247, 0.5);
        }

        .system-status {
            font-size: 0.58rem;
            color: #93c5fd;
            letter-spacing: 0.25em;
            margin-top: 4px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .core-container {
            position: relative;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .core-orb {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #fae8ff 0%, #3b82f6 60%, #020617 100%);
            border-radius: 50%;
            box-shadow: 0 0 45px rgba(168, 85, 247, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }

        .core-ring-1 {
            position: absolute;
            width: 125px;
            height: 125px;
            border: 1px dashed rgba(216, 180, 254, 0.5);
            border-radius: 50%;
            animation: rotateClockwise 30s linear infinite;
        }

        .core-ring-2 {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 50%;
            animation: rotateCounter 40s linear infinite;
        }

        @keyframes rotateClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotateCounter { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        .presets-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 420px;
        }

        .preset-chip {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 12px;
            padding: 5px 10px;
            font-size: 0.65rem;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
        }

        .preset-chip:hover {
            background: rgba(168, 85, 247, 0.35);
            border-color: #e879f9;
            color: #fff;
        }

        .terminal-box {
            width: 100%;
            max-width: 420px;
            background: rgba(3, 7, 18, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.45);
            border-radius: 16px;
            padding: 12px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(10, 15, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #c084fc;
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 10px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .guild-logs {
            margin-top: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.65rem;
            color: #94a3b8;
            background: rgba(2, 4, 15, 0.9);
            border-left: 3px solid #c084fc;
            padding: 6px 10px;
            border-radius: 0 6px 6px 0;
            min-height: 34px;
            max-height: 55px;
            overflow-y: auto;
        }

        /* 意志直結マニフェスト・ダッシュボード（初期非表示） */
        #appDashboard {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(1, 3, 12, 0.97);
            backdrop-filter: blur(30px);
            display: none;
            flex-direction: column;
            padding: 20px;
            justify-content: space-between;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(168, 85, 247, 0.3);
            padding-bottom: 12px;
        }

        .dash-title {
            font-size: 0.95rem;
            color: #e879f9;
            font-weight: 500;
        }

        .dash-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .dash-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: auto 0;
        }

        .metric-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.4rem;
            color: #38bdf8;
            font-weight: 700;
            margin-top: 4px;
        }

        .dash-btn {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            border: none;
            border-radius: 12px;
            color: white;
            padding: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>
    <div class="ambient-glow"></div>

    <div class="os-container" id="mainOS">
        <div class="header-container">
            <h1>AETHERIA OS</h1>
            <p class="system-status" id="systemStatus">Intent-to-Reality Matrix: Active</p>
        </div>

        <div class="core-container">
            <div class="core-ring-2"></div>
            <div class="core-ring-1"></div>
            <div class="core-orb" id="coreOrb"></div>
        </div>

        <div class="presets-container">
            <div class="preset-chip" onclick="setIntent('地球上の遊休計算資源の完全統合と文明マニフェスト')">🌐 文明リソース統合</div>
            <div class="preset-chip" onclick="setIntent('全人類の意識共鳴による自律分散型インフラ構築')">✨ 意識共鳴インフラ</div>
            <div class="preset-chip" onclick="setIntent('AIスウォームによる次世代自動価値生成ネットワーク')">🤖 AIスウォーム駆動</div>
            <div class="preset-chip" onclick="setIntent('物質・情報・エネルギーの完全同期調和')">🌍 宇宙同期調和</div>
        </div>

        <div class="terminal-box">
            <div class="input-group">
                <input type="text" id="intentInput" placeholder="あなたの純粋な意志を投下...">
                <button class="action-btn" onclick="activateMatrix()">意志発現（マニフェスト）</button>
            </div>
            <div class="guild-logs" id="logOutput">
                [System] 決済プロトコル完全撤廃。意志直結エンジン待機中。
            </div>
        </div>
    </div>

    <!-- 意志直結マニフェスト・ダッシュボード -->
    <div id="appDashboard">
        <div class="dash-header">
            <div class="dash-title" id="dashAppName">✨ マニフェスト・空間</div>
            <button class="dash-close" onclick="closeDashboard()">✕ 閉じる</button>
        </div>
        
        <div class="dash-content">
            <div class="metric-card">
                <div style="font-size: 0.75rem; color: #94a3b8;">グローバル文明リソース同期レート</div>
                <div class="metric-value" id="metricVal">99.98% SYNCHRONIZED</div>
            </div>
            <div style="font-size: 0.8rem; color: #cbd5e1; line-height: 1.5; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px;">
                > 投下された意志: <span id="userIntentEcho" style="color: #e879f9;"></span><br>
                > 状態: 決済・仲介を介さず、AIギルドスウォームにより直接現実空間へ具現化中。
            </div>
        </div>

        <button class="dash-btn" onclick="boostApp()">⚡ 意志共鳴フィールドを限界突破する</button>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 45; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                speedY: (Math.random() - 0.5) * 0.25,
                speedX: (Math.random() - 0.5) * 0.25,
                alpha: Math.random() * 0.7 + 0.2
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(216, 180, 254, ${p.alpha})`;
                ctx.fill();
                p.y += p.speedY;
                p.x += p.speedX;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        const orb = document.getElementById('coreOrb');
        let time = 0;
        function organicPulse() {
            time += 0.035;
            const fluctuation = 1 + (Math.sin(time) * 0.05) + (Math.sin(time * 2.3) * 0.025);
            orb.style.transform = `scale(${fluctuation})`;
            requestAnimationFrame(organicPulse);
        }
        organicPulse();

        function setIntent(text) {
            document.getElementById('intentInput').value = text;
        }

        function activateMatrix() {
            const input = document.getElementById('intentInput');
            const status = document.getElementById('systemStatus');
            const log = document.getElementById('logOutput');
            const val = input.value.trim();
            if (!val) return;

            status.textContent = "Processing: Intent Manifestation Active...";
            log.innerHTML = `> [Parser] 純粋意志受信: "${val}"<br>> [Architect] 決済不要・文明リソース直結設計中...`;

            setTimeout(() => {
                log.innerHTML += `<br>> [Swarm] AIギルドによる自律構築ネットワーク起動。`;
            }, 750);

            setTimeout(() => {
                log.innerHTML += `<br>> [Manifest] 現実空間への具現化完了。`;
                status.textContent = "Reality Synchronized";
                
                document.getElementById('dashAppName').textContent = `✨ 具現化領域: ${val.substring(0, 12)}...`;
                document.getElementById('userIntentEcho').textContent = val;
                document.getElementById('appDashboard').style.display = 'flex';
                input.value = '';
            }, 1700);
        }

        function closeDashboard() {
            document.getElementById('appDashboard').style.display = 'none';
            document.getElementById('systemStatus').textContent = "Intent-to-Reality Matrix: Active";
        }

        function boostApp() {
            const valElem = document.getElementById('metricVal');
            valElem.textContent = "∞ INFINITE RESONANCE";
            valElem.style.color = "#10b981";
        }
    </script>
</body>
</html>
