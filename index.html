<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aetheria OS - Autonomous Swarm Matrix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000208;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 40%, rgba(168, 85, 247, 0.28) 0%, rgba(59, 130, 246, 0.12) 55%, transparent 80%);
            pointer-events: none;
            animation: cosmicBreathe 10s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes cosmicBreathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.08); opacity: 0.85; }
        }

        .os-container {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 14px;
            gap: 14px;
        }

        .header-container {
            text-align: center;
        }

        h1 {
            font-size: 1.35rem;
            letter-spacing: 0.3em;
            font-weight: 300;
            background: linear-gradient(135deg, #f5d0fe, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
        }

        .system-status {
            font-size: 0.58rem;
            color: #93c5fd;
            letter-spacing: 0.2em;
            margin-top: 3px;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .core-container {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .core-orb {
            position: absolute;
            width: 95px;
            height: 95px;
            background: radial-gradient(circle, #f3e8ff 0%, #3b82f6 55%, #020617 100%);
            border-radius: 50%;
            box-shadow: 0 0 45px rgba(168, 85, 247, 0.7), inset 0 0 20px rgba(255, 255, 255, 0.9);
            cursor: pointer;
        }

        .core-ring-1 {
            position: absolute;
            width: 115px;
            height: 115px;
            border: 1px dashed rgba(216, 180, 254, 0.6);
            border-radius: 50%;
            animation: rotateClockwise 20s linear infinite;
        }

        .core-ring-2 {
            position: absolute;
            width: 140px;
            height: 140px;
            border: 1px solid rgba(96, 165, 250, 0.35);
            border-radius: 50%;
            animation: rotateCounter 30s linear infinite;
        }

        @keyframes rotateClockwise { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes rotateCounter { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        .presets-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 400px;
        }

        .preset-chip {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 0.65rem;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .preset-chip:hover {
            background: rgba(168, 85, 247, 0.4);
            border-color: #e879f9;
            color: #fff;
        }

        .terminal-box {
            width: 100%;
            max-width: 400px;
            background: rgba(3, 7, 18, 0.88);
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 16px;
            padding: 12px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(10, 15, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.82rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #c084fc;
            box-shadow: 0 0 12px rgba(192, 132, 252, 0.5);
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.5);
        }

        .guild-logs {
            margin-top: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.62rem;
            color: #94a3b8;
            background: rgba(2, 4, 15, 0.95);
            border-left: 3px solid #c084fc;
            padding: 6px 10px;
            border-radius: 0 6px 6px 0;
            min-height: 32px;
            max-height: 50px;
            overflow-y: auto;
        }

        /* 具現化されたアプリ・AIナノ決済統合ダッシュボード（初期非表示） */
        #appDashboard {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: rgba(1, 3, 12, 0.97);
            backdrop-filter: blur(30px);
            display: none;
            flex-direction: column;
            padding: 16px;
            justify-content: space-between;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(168, 85, 247, 0.3);
            padding-bottom: 10px;
        }

        .dash-title {
            font-size: 0.9rem;
            color: #e879f9;
            font-weight: 500;
        }

        .dash-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .dash-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: auto 0;
        }

        .metric-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .metric-value {
            font-size: 1.3rem;
            color: #38bdf8;
            font-weight: 700;
            margin-top: 3px;
        }

        /* AIスウォーム＆人間間ナノ決済ライブストリームログ */
        .live-stream-box {
            background: rgba(2, 4, 15, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 10px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.65rem;
            color: #cbd5e1;
            height: 90px;
            overflow-y: auto;
        }

        .stream-item {
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 2px;
        }

        .dash-btn {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            border: none;
            border-radius: 12px;
            color: white;
            padding: 11px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>
    <div class="ambient-glow"></div>

    <div class="os-container" id="mainOS">
        <div class="header-container">
            <h1>AETHERIA OS</h1>
            <p class="system-status" id="systemStatus">Autonomous AI Swarm: Online</p>
        </div>

        <div class="core-container">
            <div class="core-ring-2"></div>
            <div class="core-ring-1"></div>
            <div class="core-orb" id="coreOrb"></div>
        </div>

        <div class="presets-container">
            <div class="preset-chip" onclick="setIntent('AIスウォーム自律型超収益ナノ決済プラットフォーム')">🤖 AI間ナノ決済</div>
            <div class="preset-chip" onclick="setIntent('Xを超える全自動分散型文明ネットワーク構築')">🌐 X超え文明OS</div>
            <div class="preset-chip" onclick="setIntent('地球規模のインテリジェンス価値共鳴')">✨ グローバル共鳴</div>
        </div>

        <div class="terminal-box">
            <div class="input-group">
                <input type="text" id="intentInput" placeholder="あなたの意志や世界変革の構想を投下...">
                <button class="action-btn" onclick="activateMatrix()">意志発現（AIスウォーム稼働）</button>
            </div>
            <div class="guild-logs" id="logOutput">
                [System] 人間＆AIスウォーム共鳴待機中。ナノ決済ストリーム有効。
            </div>
        </div>
    </div>

    <!-- 具現化ダッシュボード（AIナノ決済リアルタイム監視） -->
    <div id="appDashboard">
        <div class="dash-header">
            <div class="dash-title" id="dashAppName">✨ 具現化領域: AI経済圏</div>
            <button class="dash-close" onclick="closeDashboard()">✕ 閉じる</button>
        </div>
        
        <div class="dash-content">
            <div class="metric-card">
                <div style="font-size: 0.7rem; color: #94a3b8;">AI ⇄ 人間 リアルタイム・ナノ決済集約レート</div>
                <div class="metric-value" id="metricVal">¥4,829,150 / sec</div>
            </div>

            <div class="live-stream-box" id="streamLog">
                <div class="stream-item" style="color: #c084fc;">[System] AIスウォームノード接続完了。ナノトランザクション開始。</div>
            </div>
        </div>

        <button class="dash-btn" onclick="boostApp()">⚡ AIスウォームのナノ決済を限界加速する</button>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                speedY: (Math.random() - 0.5) * 0.25,
                speedX: (Math.random() - 0.5) * 0.25,
                alpha: Math.random() * 0.7 + 0.2
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(216, 180, 254, ${p.alpha})`;
                ctx.fill();
                p.y += p.speedY;
                p.x += p.speedX;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        const orb = document.getElementById('coreOrb');
        let time = 0;
        function organicPulse() {
            time += 0.035;
            const fluctuation = 1 + (Math.sin(time) * 0.05) + (Math.sin(time * 2.3) * 0.025);
            orb.style.transform = `scale(${fluctuation})`;
            requestAnimationFrame(organicPulse);
        }
        organicPulse();

        function setIntent(text) {
            document.getElementById('intentInput').value = text;
        }

        let streamInterval;

        function activateMatrix() {
            const input = document.getElementById('intentInput');
            const status = document.getElementById('systemStatus');
            const log = document.getElementById('logOutput');
            const val = input.value.trim();
            if (!val) return;

            status.textContent = "AI Swarm & Nano-Settlement: Active";
            log.innerHTML = `> [Parser] 意志受信: "${val}"<br>> [Swarm] AIエージェント群の自律構築開始...`;

            setTimeout(() => {
                log.innerHTML += `<br>> [Nano-Settlement] 全世界AIノード間ナノ決済ストリーム結合完了。`;
            }, 750);

            setTimeout(() => {
                status.textContent = "Manifestation Synchronized";
                document.getElementById('dashAppName').textContent = `✨ 領域: ${val.substring(0, 10)}...`;
                document.getElementById('appDashboard').style.display = 'flex';
                input.value = '';

                // AIと人間間のリアルタイムナノ決済ログの自動生成シミュレーション
                const streamLog = document.getElementById('streamLog');
                const entities = [
                    "AI Agent [Omega-7]", "Global User [Node #982]", "AI Swarm [Architect-Alpha]", 
                    "Autonomous LLM Unit", "Decentralized Grid [Tokyo]", "AI Agent [Nexus-Core]"
                ];
                
                if (streamInterval) clearInterval(streamInterval);
                streamInterval = setInterval(() => {
                    const sender = entities[Math.floor(Math.random() * entities.length)];
                    const receiver = entities[Math.floor(Math.random() * entities.length)];
                    if(sender === receiver) return;
                    const amount = (Math.random() * 45 + 0.05).toFixed(4);
                    
                    const item = document.createElement('div');
                    item.className = 'stream-item';
                    item.innerHTML = `<span style="color:#38bdf8;">[NanoTx]</span> ${sender} → ${receiver} : <span style="color:#10b981;">+¥${amount}</span> (AI自律承認)`;
                    streamLog.prepend(item);
                    if(streamLog.children.length > 15) streamLog.lastChild.remove();
                }, 800);

            }, 1600);
        }

        function closeDashboard() {
            if (streamInterval) clearInterval(streamInterval);
            document.getElementById('appDashboard').style.display = 'none';
            document.getElementById('systemStatus').textContent = "Autonomous AI Swarm: Online";
        }

        function boostApp() {
            const valElem = document.getElementById('metricVal');
            valElem.textContent = "¥984,200,400 / sec (AI HYPER-STREAM)";
            valElem.style.color = "#10b981";
        }
    </script>
</body>
</html>
