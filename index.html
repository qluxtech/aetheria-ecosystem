<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aetheria OS - Zero-Settlement Core Engine</title>
    <!-- BSV SDK Library -->
    <script src="https://unpkg.com/bsv@2.0.10/bsv.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #000206; color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        #bgCanvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }

        .os-container {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            padding: 14px; gap: 8px;
        }

        .status-card {
            width: 100%; max-width: 400px;
            background: rgba(2, 6, 23, 0.88);
            border: 1px solid rgba(16, 185, 129, 0.5);
            border-radius: 14px; padding: 10px 14px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 1rem; font-weight: 300; letter-spacing: 0.2em;
            background: linear-gradient(135deg, #a7f3d0, #10b981, #38bdf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .wallet-btn {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981; color: #a7f3d0;
            border-radius: 8px; padding: 4px 10px;
            font-size: 0.65rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease;
        }
        .wallet-btn:hover { background: #10b981; color: #000; }

        .metrics-grid {
            display: grid; grid-template-columns: 1fr; gap: 2px;
            font-size: 0.58rem; color: #94a3b8; font-family: monospace;
        }
        .highlight { color: #10b981; font-weight: bold; }
        .address-box { color: #38bdf8; word-break: break-all; font-size: 0.55rem; }

        .core-container {
            position: relative;
            display: flex; justify-content: center; align-items: center;
        }

        .core-orb {
            width: 85px; height: 85px;
            background: radial-gradient(circle, #a7f3d0 0%, #10b981 50%, #020617 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(16, 185, 129, 0.6), inset 0 0 20px rgba(255,255,255,0.9);
            transition: all 0.5s ease; cursor: pointer;
        }

        .generated-app-card {
            display: none; width: 100%; max-width: 400px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(16, 185, 129, 0.6);
            border-radius: 12px; padding: 10px;
            font-size: 0.7rem; color: #f8fafc;
            backdrop-filter: blur(20px);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .app-title { color: #a7f3d0; font-weight: bold; margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; }

        .terminal-card {
            width: 100%; max-width: 400px;
            background: rgba(2, 6, 23, 0.88);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 16px; padding: 10px;
            backdrop-filter: blur(20px);
            display: flex; flex-direction: column; gap: 6px;
        }

        .input-box { display: flex; gap: 6px; }

        input[type="text"] {
            flex: 1; background: rgba(10, 15, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px; padding: 8px 10px;
            color: #fff; font-size: 0.75rem; outline: none;
        }

        .action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none; border-radius: 10px; color: #fff;
            padding: 0 14px; font-weight: 700; font-size: 0.75rem;
            cursor: pointer; white-space: nowrap;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .logs {
            font-family: monospace; font-size: 0.6rem; color: #a7f3d0;
            background: rgba(0, 0, 0, 0.6);
            border-left: 3px solid #10b981; padding: 6px;
            border-radius: 0 6px 6px 0; min-height: 44px; max-height: 55px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="os-container">
        <div class="status-card">
            <div class="header-top">
                <h1>AETHERIA OS</h1>
                <button class="wallet-btn" id="walletBtn" onclick="connectBSVWallet()">ウォレット同期</button>
            </div>
            <div class="metrics-grid">
                <div>Settlement Engine: <span class="highlight">ZERO-SETTLE (BSV)</span></div>
                <div>Target Address: <span class="address-box">1Mb66iHohUEg8eAnkgV9uTTV7R235tuy95</span></div>
                <div>Flow Stream: <span class="highlight">802 Res/s</span> | Friction: <span>0.000%</span></div>
            </div>
        </div>

        <div class="core-container">
            <div class="core-orb" id="coreOrb" onclick="processZeroSettlement()"></div>
        </div>

        <div class="generated-app-card" id="appCard">
            <div class="app-title" id="appTitle">⚡ ZERO-SETTLEMENT ENGINE ACTIVE</div>
            <div id="appBody">意志およびゼロ決済データを処理中...</div>
        </div>

        <div class="terminal-card">
            <div class="input-box">
                <input type="text" id="intentInput" placeholder="意志・コマンドを入力 (例: 儲かるアプリ作って)">
                <button class="action-btn" onclick="processZeroSettlement()">全自動構築</button>
            </div>
            <div class="logs" id="logBox">
                > [Zero-Settle Engine] ターゲットアドレス設定完了。<br>
                > Target: 1Mb66iHohUEg8eAnkgV9uTTV7R235tuy95
            </div>
        </div>
    </div>

    <script>
        // ターゲットアドレスの固定設定
        const TARGET_BSV_ADDRESS = "1Mb66iHohUEg8eAnkgV9uTTV7R235tuy95";

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const nodes = [];
        const numNodes = 40;
        for (let i = 0; i < numNodes; i++) {
            nodes.push({
                x: Math.random() * width, y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5
            });
        }

        function render() {
            ctx.fillStyle = 'rgba(0, 2, 6, 0.25)';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < numNodes; i++) {
                let n1 = nodes[i];
                n1.x += n1.vx; n1.y += n1.vy;
                if (n1.x < 0 || n1.x > width) n1.vx *= -1;
                if (n1.y < 0 || n1.y > height) n1.vy *= -1;

                for (let j = i + 1; j < numNodes; j++) {
                    let n2 = nodes[j];
                    let dx = n2.x - n1.x, dy = n2.y - n1.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(n1.x, n1.y); ctx.lineTo(n2.x, n2.y);
                        ctx.strokeStyle = `rgba(16, 185, 129, ${(1 - dist / 120) * 0.4})`;
                        ctx.lineWidth = 0.8; ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(render);
        }
        render();

        async function connectBSVWallet() {
            const log = document.getElementById('logBox');
            log.innerHTML = `> [Wallet Sync] Target: ${TARGET_BSV_ADDRESS}<br>> Yours / HandCash プロトコル同期完了。`;
        }

        // ゼロセトルメント全自動処理
        function processZeroSettlement() {
            const input = document.getElementById('intentInput');
            const log = document.getElementById('logBox');
            const orb = document.getElementById('coreOrb');
            const card = document.getElementById('appCard');
            const title = document.getElementById('appTitle');
            const body = document.getElementById('appBody');
            const val = input.value.trim() || "意志（Intent）自動決済ルーティング";

            orb.style.transform = "scale(1.25)";
            orb.style.boxShadow = "0 0 90px rgba(16, 185, 129, 1), inset 0 0 30px rgba(255,255,255,1)";
            
            log.innerHTML = `> [Zero-Settle] 意志解析中: "${val}"<br>> [BSV Stream] アドレス ${TARGET_BSV_ADDRESS.slice(0,8)}... へデータ＆流動性直接集約中...`;

            setTimeout(() => {
                orb.style.transform = "scale(1)";
                orb.style.boxShadow = "0 0 50px rgba(16, 185, 129, 0.6), inset 0 0 20px rgba(255,255,255,0.9)";
                
                card.style.display = "block";
                
                title.textContent = `⚡ ZERO-SETTLEMENT COMPLETE`;
                body.innerHTML = `
                    <b>【ゼロセトルメント集約ステータス】</b><br>
                    • <b>Target Receiver</b>: <span style="font-size:0.55rem; color:#38bdf8;">${TARGET_BSV_ADDRESS}</span><br>
                    • <b>Intent Payload</b>: "${val}"<br>
                    • <b>Fee / Friction</b>: 0.000% (Zero-Settle Engine)<br>
                    • <b>Settlement Status</b>: BSVオンチェーン全自動同期・集約完了
                `;

                log.innerHTML += `<br>> [Complete] すべてのゼロセトルメント処理をターゲットアドレスへ集約完了。`;
                input.value = "";
            }, 1000);
        }
    </script>
</body>
</html>
