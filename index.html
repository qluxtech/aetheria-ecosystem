<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHERIA OS</title>
    <script src="https://unpkg.com/bsv@2.0.10/bsv.min.js"></script>
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: rgba(15, 23, 42, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-cyan: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        #bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .os-container {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            padding: 24px 16px; gap: 12px;
        }

        /* 画面上部：ステータスパネル */
        .status-card {
            width: 100%; max-width: 420px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px; padding: 14px 18px;
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

        .brand-logo {
            font-size: 0.8rem; font-weight: 600; letter-spacing: 0.3em;
            color: var(--text-main); text-transform: uppercase;
            display: flex; align-items: center; gap: 8px;
        }

        .brand-logo::before {
            content: ''; display: inline-block; width: 6px; height: 6px;
            background: var(--accent-cyan); border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .wallet-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12); color: var(--text-main);
            border-radius: 100px; padding: 5px 14px;
            font-size: 0.65rem; font-weight: 500; cursor: pointer;
            transition: all 0.25s ease;
        }
        .wallet-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); }

        .metrics-grid {
            display: flex; flex-direction: column; gap: 3px;
            font-size: 0.6rem; color: var(--text-sub);
            font-family: ui-monospace, "SF Mono", monospace;
        }
        .address-box { color: var(--accent-cyan); font-size: 0.58rem; letter-spacing: -0.01em; opacity: 0.9; }

        /* 中央：パーティクル・ホログラフィックコア Canvas */
        .core-container {
            position: relative; display: flex; justify-content: center; align-items: center;
            flex: 1; width: 100%;
        }

        #coreCanvas {
            width: 280px; height: 280px;
            cursor: pointer;
        }

        /* 出力結果カード */
        .generated-app-card {
            display: none; width: 100%; max-width: 420px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px; padding: 16px;
            font-size: 0.72rem; color: var(--text-main); line-height: 1.6;
            backdrop-filter: blur(30px);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .app-title { color: var(--accent-cyan); font-weight: 600; margin-bottom: 8px; font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; }

        /* 画面下部：プロンプト入力 */
        .terminal-card {
            width: 100%; max-width: 420px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px; padding: 8px;
            backdrop-filter: blur(30px);
            display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .input-box {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px; padding: 4px 6px 4px 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: border-color 0.2s ease;
        }
        .input-box:focus-within { border-color: rgba(56, 189, 248, 0.4); }

        input[type="text"] {
            flex: 1; background: transparent; border: none;
            color: #fff; font-size: 0.82rem; outline: none; font-weight: 400;
        }
        input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.25); }

        .action-btn {
            background: #ffffff; border: none; border-radius: 14px; color: #030712;
            padding: 10px 18px; font-weight: 600; font-size: 0.75rem;
            cursor: pointer; white-space: nowrap; transition: all 0.2s ease;
        }
        .action-btn:hover { background: #f1f5f9; transform: scale(1.02); }

        .logs {
            font-family: ui-monospace, "SF Mono", monospace; font-size: 0.6rem; color: var(--text-sub);
            padding: 2px 8px; max-height: 38px; overflow-y: auto; line-height: 1.4; opacity: 0.8;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="os-container">
        <div class="status-card">
            <div class="header-top">
                <div class="brand-logo">AETHERIA</div>
                <button class="wallet-btn" onclick="connectBSVWallet()">Sync Wallet</button>
            </div>
            <div class="metrics-grid">
                <div>Engine: BSV Zero-Settlement</div>
                <div>Target: <span class="address-box">1Mb66iHohUEg8eAnkgV9uTTV7R235tuy95</span></div>
            </div>
        </div>

        <div class="core-container">
            <canvas id="coreCanvas" onclick="processZeroSettlement()"></canvas>
        </div>

        <div class="generated-app-card" id="appCard">
            <div class="app-title" id="appTitle">Execution State</div>
            <div id="appBody">Processing intent...</div>
        </div>

        <div class="terminal-card">
            <div class="input-box">
                <input type="text" id="intentInput" placeholder="Send prompt or command...">
                <button class="action-btn" onclick="processZeroSettlement()">Run</button>
            </div>
            <div class="logs" id="logBox">
                > System initialized. Quantum swarm core breathing.
            </div>
        </div>
    </div>

    <script>
        const TARGET_BSV_ADDRESS = "1Mb66iHohUEg8eAnkgV9uTTV7R235tuy95";

        // 背景グリッド描画
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let width, height;

        function resize() {
            width = bgCanvas.width = window.innerWidth;
            height = bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function renderBg() {
            bgCtx.fillStyle = '#030712';
            bgCtx.fillRect(0, 0, width, height);
            requestAnimationFrame(renderBg);
        }
        renderBg();

        // 1/f ゆらぎアルゴリズム
        class PinkNoise {
            constructor() {
                this.b = [0,0,0,0,0,0,0];
            }
            next() {
                const white = Math.random() * 2 - 1;
                this.b[0] = 0.99886 * this.b[0] + white * 0.0555179;
                this.b[1] = 0.99332 * this.b[1] + white * 0.0750759;
                this.b[2] = 0.96900 * this.b[2] + white * 0.1538520;
                this.b[3] = 0.86650 * this.b[3] + white * 0.3104856;
                this.b[4] = 0.55000 * this.b[4] + white * 0.5329522;
                this.b[5] = -0.7616 * this.b[5] - white * 0.0168980;
                const pink = this.b[0] + this.b[1] + this.b[2] + this.b[3] + this.b[4] + this.b[5] + this.b[6] + white * 0.5362;
                this.b[6] = white * 0.115926;
                return (pink / 5) + 0.5;
            }
        }

        // ホログラフィック・パーティクルコアの構築
        const coreCanvas = document.getElementById('coreCanvas');
        const coreCtx = coreCanvas.getContext('2d');
        coreCanvas.width = 280; coreCanvas.height = 280;

        const pinkNoise = new PinkNoise();
        const particleCount = 600;
        const particles = [];

        for (let i = 0; i < particleCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const radius = 65 + Math.random() * 15;
            particles.push({
                x: radius * Math.sin(phi) * Math.cos(theta),
                y: radius * Math.sin(phi) * Math.sin(theta),
                z: radius * Math.cos(phi),
                baseRadius: radius,
                size: Math.random() * 1.8 + 0.6,
                alpha: Math.random() * 0.8 + 0.2,
                color: Math.random() > 0.3 ? '#38bdf8' : '#818cf8'
            });
        }

        let angleY = 0;
        let angleX = 0;
        let smoothFluctuation = 0.5;
        let boostRadius = 1.0;

        function renderParticleCore() {
            coreCtx.clearRect(0, 0, 280, 280);
            
            const targetNoise = pinkNoise.next();
            smoothFluctuation += (targetNoise - smoothFluctuation) * 0.04;
            const currentScale = boostRadius * (0.88 + smoothFluctuation * 0.24);

            const cx = 140, cy = 140;
            angleY += 0.008;
            angleX += 0.004;

            // 中心エネルギー光
            const centerGlow = coreCtx.createRadialGradient(cx, cy, 0, cx, cy, 70 * currentScale);
            centerGlow.addColorStop(0, 'rgba(56, 189, 248, 0.45)');
            centerGlow.addColorStop(0.4, 'rgba(129, 140, 248, 0.15)');
            centerGlow.addColorStop(1, 'rgba(3, 7, 18, 0)');
            coreCtx.fillStyle = centerGlow;
            coreCtx.beginPath();
            coreCtx.arc(cx, cy, 70 * currentScale, 0, Math.PI * 2);
            coreCtx.fill();

            // 3Dパーティクル回転描画
            particles.sort((a, b) => a.z - b.z); // 深度ソート

            particles.forEach(p => {
                // Y軸・X軸回転
                let x1 = p.x * Math.cos(angleY) - p.z * Math.sin(angleY);
                let z1 = p.z * Math.cos(angleY) + p.x * Math.sin(angleY);

                let y2 = p.y * Math.cos(angleX) - z1 * Math.sin(angleX);
                let z2 = z1 * Math.cos(angleX) + p.y * Math.sin(angleX);

                const scale = (z2 + 150) / 300 * currentScale;
                const renderX = cx + x1 * scale;
                const renderY = cy + y2 * scale;
                const opacity = Math.max(0.1, (z2 + 100) / 200 * p.alpha);

                coreCtx.fillStyle = p.color;
                coreCtx.globalAlpha = opacity;
                coreCtx.beginPath();
                coreCtx.arc(renderX, renderY, p.size * scale, 0, Math.PI * 2);
                coreCtx.fill();
            });

            coreCtx.globalAlpha = 1.0;
            requestAnimationFrame(renderParticleCore);
        }
        renderParticleCore();

        async function connectBSVWallet() {
            const log = document.getElementById('logBox');
            log.innerHTML = `> Wallet linked: ${TARGET_BSV_ADDRESS.slice(0,8)}...`;
        }

        function processZeroSettlement() {
            const input = document.getElementById('intentInput');
            const log = document.getElementById('logBox');
            const card = document.getElementById('appCard');
            const title = document.getElementById('appTitle');
            const body = document.getElementById('appBody');
            const val = input.value.trim() || "Autonomous Protocol Run";

            boostRadius = 1.35;
            setTimeout(() => { boostRadius = 1.0; }, 500);

            log.innerHTML = `> Executing: "${val}"<br>> Routing to ${TARGET_BSV_ADDRESS.slice(0,8)}...`;

            setTimeout(() => {
                card.style.display = "block";
                title.textContent = "Execution Output";
                body.innerHTML = `
                    <b>Prompt</b>: "${val}"<br>
                    <b>Target Receiver</b>: <span style="font-size:0.62rem; color:#38bdf8;">${TARGET_BSV_ADDRESS}</span><br>
                    <b>Latency</b>: 0.00ms (Zero-Settlement Stream)<br>
                    <b>Status</b>: Confirmed on BSV Global Ledger
                `;
                log.innerHTML += `<br>> Success. Block verified.`;
                input.value = "";
            }, 600);
        }
    </script>
</body>
</html>
