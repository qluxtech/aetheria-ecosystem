<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHERIA OS - Quantum Core</title>
    <script src="https://unpkg.com/bsv@2.0.10/bsv.min.js"></script>
    <style>
        :root {
            --bg-color: #02040a;
            --panel-bg: rgba(10, 16, 30, 0.75);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-cyan: #38bdf8;
            --accent-purple: #818cf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        #bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .os-container {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            padding: 24px 16px; gap: 12px;
        }

        /* 画面上部：ステータスパネル */
        .status-card {
            width: 100%; max-width: 420px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px; padding: 14px 18px;
            backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            position: relative; overflow: hidden;
        }

        /* 光のグラデーションボーダー */
        .status-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            animation: borderGlow 4s infinite linear;
        }
        @keyframes borderGlow { 0% { left: -100%; } 100% { left: 100%; } }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

        .brand-logo {
            font-size: 0.82rem; font-weight: 700; letter-spacing: 0.35em;
            color: var(--text-main); text-transform: uppercase;
            display: flex; align-items: center; gap: 8px;
        }

        .brand-logo::before {
            content: ''; display: inline-block; width: 6px; height: 6px;
            background: var(--accent-cyan); border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-cyan);
        }

        .wallet-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.18); color: var(--text-main);
            border-radius: 100px; padding: 6px 16px;
            font-size: 0.65rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
        }
        .wallet-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        .metrics-grid {
            display: flex; flex-direction: column; gap: 3px;
            font-size: 0.6rem; color: var(--text-sub);
            font-family: ui-monospace, "SF Mono", monospace;
        }
        .address-box { color: var(--accent-cyan); font-size: 0.58rem; letter-spacing: -0.01em; opacity: 0.9; }

        /* 中央：超ハイクオリティ・ホログラムコア Canvas */
        .core-container {
            position: relative; display: flex; justify-content: center; align-items: center;
            flex: 1; width: 100%;
        }

        #coreCanvas {
            width: 340px; height: 340px;
            cursor: pointer;
        }

        /* 出力結果カード */
        .generated-app-card {
            display: none; width: 100%; max-width: 420px;
            background: rgba(10, 16, 30, 0.88);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 20px; padding: 16px;
            font-size: 0.72rem; color: var(--text-main); line-height: 1.6;
            backdrop-filter: blur(35px);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(56, 189, 248, 0.15);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .app-title { color: var(--accent-cyan); font-weight: 700; margin-bottom: 8px; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; }

        /* 画面下部：プロンプト入力 */
        .terminal-card {
            width: 100%; max-width: 420px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px; padding: 8px;
            backdrop-filter: blur(35px);
            display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.15);
        }

        .input-box {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px; padding: 4px 6px 4px 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .input-box:focus-within {
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        input[type="text"] {
            flex: 1; background: transparent; border: none;
            color: #fff; font-size: 0.82rem; outline: none; font-weight: 400;
        }
        input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.3); }

        .action-btn {
            background: linear-gradient(135deg, #ffffff, #e2e8f0); border: none; border-radius: 14px; color: #02040a;
            padding: 10px 20px; font-weight: 700; font-size: 0.75rem;
            cursor: pointer; white-space: nowrap; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }
        .action-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
        }

        .logs {
            font-family: ui-monospace, "SF Mono", monospace; font-size: 0.6rem; color: var(--text-sub);
            padding: 2px 8px; max-height: 38px; overflow-y: auto; line-height: 1.4; opacity: 0.85;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="os-container">
        <div class="status-card">
            <div class="header-top">
                <div class="brand-logo">AETHERIA</div>
                <button class="wallet-btn" onclick="connectBSVWallet()">Sync Wallet</button>
            </div>
            <div class="metrics-grid">
                <div>Engine: BSV Zero-Settlement Layer</div>
                <div>Target: <span class="address-box">1Mb66iHohUEg8eAnkgV9uTTV7R235tuy95</span></div>
            </div>
        </div>

        <div class="core-container">
            <canvas id="coreCanvas" onclick="processZeroSettlement()"></canvas>
        </div>

        <div class="generated-app-card" id="appCard">
            <div class="app-title" id="appTitle">Execution State</div>
            <div id="appBody">Processing intent...</div>
        </div>

        <div class="terminal-card">
            <div class="input-box">
                <input type="text" id="intentInput" placeholder="Send prompt or command...">
                <button class="action-btn" onclick="processZeroSettlement()">Run</button>
            </div>
            <div class="logs" id="logBox">
                > Quantum mesh core Online. 1/f fluctuation synced.
            </div>
        </div>
    </div>

    <script>
        const TARGET_BSV_ADDRESS = "1Mb66iHohUEg8eAnkgV9uTTV7R235tuy95";

        // 1/f ゆらぎアルゴリズム
        class PinkNoise {
            constructor() { this.b = [0,0,0,0,0,0,0]; }
            next() {
                const white = Math.random() * 2 - 1;
                this.b[0] = 0.99886 * this.b[0] + white * 0.0555179;
                this.b[1] = 0.99332 * this.b[1] + white * 0.0750759;
                this.b[2] = 0.96900 * this.b[2] + white * 0.1538520;
                this.b[3] = 0.86650 * this.b[3] + white * 0.3104856;
                this.b[4] = 0.55000 * this.b[4] + white * 0.5329522;
                this.b[5] = -0.7616 * this.b[5] - white * 0.0168980;
                const pink = this.b[0] + this.b[1] + this.b[2] + this.b[3] + this.b[4] + this.b[5] + this.b[6] + white * 0.5362;
                this.b[6] = white * 0.115926;
                return (pink / 5) + 0.5;
            }
        }
        const pinkNoise = new PinkNoise();

        // 背景アンビエント光・グラデーション描画
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let width, height;

        function resize() {
            width = bgCanvas.width = window.innerWidth;
            height = bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let ambientTime = 0;
        function renderBg() {
            ambientTime += 0.005;
            bgCtx.fillStyle = '#02040a';
            bgCtx.fillRect(0, 0, width, height);

            // 1/f呼吸と同期する背景オーロラブラー
            const bgGlow = bgCtx.createRadialGradient(
                width / 2, height / 2, 50,
                width / 2, height / 2, Math.max(width, height) * 0.6
            );
            const auraScale = 0.12 + Math.sin(ambientTime) * 0.04;
            bgGlow.addColorStop(0, `rgba(56, 189, 248, ${auraScale})`);
            bgGlow.addColorStop(0.5, `rgba(129, 140, 248, ${auraScale * 0.5})`);
            bgGlow.addColorStop(1, 'rgba(2, 4, 10, 0)');

            bgCtx.fillStyle = bgGlow;
            bgCtx.fillRect(0, 0, width, height);

            requestAnimationFrame(renderBg);
        }
        renderBg();

        // 3D量子メッシュコア Canvas
        const coreCanvas = document.getElementById('coreCanvas');
        const coreCtx = coreCanvas.getContext('2d');
        coreCanvas.width = 340; coreCanvas.height = 340;

        const particleCount = 220;
        const particles = [];

        for (let i = 0; i < particleCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const radius = 85 + Math.random() * 12;
            particles.push({
                x: radius * Math.sin(phi) * Math.cos(theta),
                y: radius * Math.sin(phi) * Math.sin(theta),
                z: radius * Math.cos(phi),
                size: Math.random() * 2.0 + 0.8,
                color: Math.random() > 0.35 ? '#38bdf8' : '#818cf8'
            });
        }

        let angleY = 0;
        let angleX = 0;
        let smoothFluctuation = 0.5;
        let boostRadius = 1.0;
        let mouseX = 0, mouseY = 0;

        // タッチ・マウス位置追従
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.0001;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.0001;
        });

        function draw3DRing(cx, cy, radius, rotX, rotY, color, lineWidth) {
            coreCtx.save();
            coreCtx.beginPath();
            const segments = 90;
            for (let i = 0; i <= segments; i++) {
                const a = (i / segments) * Math.PI * 2;
                let rx = radius * Math.cos(a);
                let ry = 0;
                let rz = radius * Math.sin(a);

                let x1 = rx * Math.cos(rotY) - rz * Math.sin(rotY);
                let z1 = rz * Math.cos(rotY) + rx * Math.sin(rotY);

                let y2 = ry * Math.cos(rotX) - z1 * Math.sin(rotX);
                let z2 = z1 * Math.cos(rotX) + ry * Math.sin(rotX);

                const scale = (z2 + 220) / 440;
                const px = cx + x1 * scale;
                const py = cy + y2 * scale;

                if (i === 0) coreCtx.moveTo(px, py);
                else coreCtx.lineTo(px, py);
            }
            coreCtx.strokeStyle = color;
            coreCtx.lineWidth = lineWidth;
            coreCtx.stroke();
            coreCtx.restore();
        }

        function renderQuantumCore() {
            coreCtx.clearRect(0, 0, 340, 340);
            
            const targetNoise = pinkNoise.next();
            smoothFluctuation += (targetNoise - smoothFluctuation) * 0.04;
            const currentScale = boostRadius * (0.9 + smoothFluctuation * 0.22);

            const cx = 170, cy = 170;
            angleY += 0.007 + mouseX;
            angleX += 0.0035 + mouseY;

            // マルチレイヤー・超高輝度発光コア
            const coreGlow = coreCtx.createRadialGradient(cx, cy, 0, cx, cy, 100 * currentScale);
            coreGlow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            coreGlow.addColorStop(0.18, 'rgba(56, 189, 248, 0.7)');
            coreGlow.addColorStop(0.48, 'rgba(129, 140, 248, 0.25)');
            coreGlow.addColorStop(1, 'rgba(2, 4, 10, 0)');

            coreCtx.fillStyle = coreGlow;
            coreCtx.beginPath();
            coreCtx.arc(cx, cy, 100 * currentScale, 0, Math.PI * 2);
            coreCtx.fill();

            // SF感のある外周オービットリング（3層）
            draw3DRing(cx, cy, 112 * currentScale, angleX * 1.5, angleY * 1.2, 'rgba(56, 189, 248, 0.45)', 1.4);
            draw3DRing(cx, cy, 128 * currentScale, -angleX * 1.2, angleY * 0.8, 'rgba(129, 140, 248, 0.3)', 1.0);
            draw3DRing(cx, cy, 142 * currentScale, angleX * 0.8, -angleY * 1.5, 'rgba(56, 189, 248, 0.15)', 0.6);

            // 粒子3D座標変換
            const projected = particles.map(p => {
                let x1 = p.x * Math.cos(angleY) - p.z * Math.sin(angleY);
                let z1 = p.z * Math.cos(angleY) + p.x * Math.sin(angleY);

                let y2 = p.y * Math.cos(angleX) - z1 * Math.sin(angleX);
                let z2 = z1 * Math.cos(angleX) + p.y * Math.sin(angleX);

                const scale = (z2 + 220) / 440 * currentScale;
                return {
                    x: cx + x1 * scale,
                    y: cy + y2 * scale,
                    z: z2,
                    size: p.size * scale,
                    color: p.color
                };
            });

            // 量子メッシュ接続線
            for (let i = 0; i < projected.length; i++) {
                for (let j = i + 1; j < projected.length; j++) {
                    const dx = projected[i].x - projected[j].x;
                    const dy = projected[i].y - projected[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 40) {
                        coreCtx.beginPath();
                        coreCtx.moveTo(projected[i].x, projected[i].y);
                        coreCtx.lineTo(projected[j].x, projected[j].y);
                        coreCtx.strokeStyle = `rgba(56, 189, 248, ${(1 - dist / 40) * 0.4})`;
                        coreCtx.lineWidth = 0.6;
                        coreCtx.stroke();
                    }
                }
            }

            // 粒子の描画（深度順）
            projected.sort((a, b) => a.z - b.z);
            projected.forEach(p => {
                coreCtx.fillStyle = p.color;
                coreCtx.beginPath();
                coreCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                coreCtx.fill();
            });

            requestAnimationFrame(renderQuantumCore);
        }
        renderQuantumCore();

        async function connectBSVWallet() {
            const log = document.getElementById('logBox');
            log.innerHTML = `> Wallet linked: ${TARGET_BSV_ADDRESS.slice(0,8)}...`;
        }

        function processZeroSettlement() {
            const input = document.getElementById('intentInput');
            const log = document.getElementById('logBox');
            const card = document.getElementById('appCard');
            const title = document.getElementById('appTitle');
            const body = document.getElementById('appBody');
            const val = input.value.trim() || "Autonomous Protocol Run";

            boostRadius = 1.4;
            setTimeout(() => { boostRadius = 1.0; }, 600);

            log.innerHTML = `> Executing: "${val}"<br>> Routing to ${TARGET_BSV_ADDRESS.slice(0,8)}...`;

            setTimeout(() => {
                card.style.display = "block";
                title.textContent = "Execution Output";
                body.innerHTML = `
                    <b>Prompt</b>: "${val}"<br>
                    <b>Target Receiver</b>: <span style="font-size:0.62rem; color:#38bdf8;">${TARGET_BSV_ADDRESS}</span><br>
                    <b>Latency</b>: 0.00ms (Zero-Settlement Stream)<br>
                    <b>Status</b>: Confirmed on BSV Global Ledger
                `;
                log.innerHTML += `<br>> Success. Block verified.`;
                input.value = "";
            }, 600);
        }
    </script>
</body>
</html>
