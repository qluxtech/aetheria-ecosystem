<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aetheria OS - Beyond Micro-Payments Core</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #000206; color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        #bgCanvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }

        .os-container {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            padding: 16px; gap: 10px;
        }

        /* 上部：決済超越ステータス */
        .status-card {
            width: 100%; max-width: 400px;
            background: rgba(2, 6, 23, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 14px; padding: 12px 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        h1 {
            font-size: 1.1rem; font-weight: 300; letter-spacing: 0.3em;
            background: linear-gradient(135deg, #f5d0fe, #60a5fa, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center; margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.58rem; color: #38bdf8; text-align: center;
            letter-spacing: 0.15em; font-family: monospace; margin-bottom: 8px;
        }

        .metrics-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px;
            font-size: 0.62rem; color: #94a3b8; font-family: monospace;
        }
        .highlight { color: #10b981; font-weight: bold; }

        /* 中央：エネルギー共鳴コア */
        .core-container {
            position: relative;
            display: flex; justify-content: center; align-items: center;
        }

        .core-orb {
            width: 90px; height: 90px;
            background: radial-gradient(circle, #f3e8ff 0%, #3b82f6 60%, #020617 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.8), inset 0 0 20px rgba(255,255,255,0.9);
            transition: all 0.5s ease;
            cursor: pointer;
        }

        /* 下部：意志投入・エネルギー同期ターミナル */
        .terminal-card {
            width: 100%; max-width: 400px;
            background: rgba(2, 6, 23, 0.88);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 16px; padding: 12px;
            backdrop-filter: blur(20px);
            display: flex; flex-direction: column; gap: 8px;
        }

        .input-box { display: flex; gap: 6px; }

        input[type="text"] {
            flex: 1; background: rgba(10, 15, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px; padding: 10px 12px;
            color: #fff; font-size: 0.8rem; outline: none;
        }

        .action-btn {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none; border-radius: 10px; color: white;
            padding: 0 16px; font-weight: 600; font-size: 0.8rem;
            cursor: pointer; white-space: nowrap;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .logs {
            font-family: monospace; font-size: 0.62rem; color: #38bdf8;
            background: rgba(0, 0, 0, 0.6);
            border-left: 3px solid #c084fc; padding: 6px 8px;
            border-radius: 0 6px 6px 0; min-height: 48px; max-height: 60px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="os-container">
        <!-- パネル -->
        <div class="status-card">
            <h1>AETHERIA OS</h1>
            <div class="subtitle">BEYOND MICRO-PAYMENTS ENGINE</div>
            <div class="metrics-grid">
                <div>Settlement: <span class="highlight">ZERO-SETTLE</span></div>
                <div>Flow Stream: <span id="flowRate">1,024 Res/s</span></div>
                <div>Cross-Chain: <span style="color:#c084fc">EVM/Solana/BTC</span></div>
                <div>Friction: <span class="highlight">0.000% (Absolute)</span></div>
            </div>
        </div>

        <!-- コア -->
        <div class="core-container">
            <div class="core-orb" id="coreOrb" onclick="triggerSymbiosis()"></div>
        </div>

        <!-- 意志同期フォーム -->
        <div class="terminal-card">
            <div class="input-box">
                <input type="text" id="intentInput" placeholder="決済を超えた意志（Intent）を投下...">
                <button class="action-btn" onclick="triggerSymbiosis()">共鳴発現</button>
            </div>
            <div class="logs" id="logBox">
                > [Zero-Settle Engine] 従来的金銭決済を完全排除。<br>
                > [Symbiosis] 全ブロックチェーン・AI流動性共鳴待機中...
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const nodes = [];
        const numNodes = 50;

        for (let i = 0; i < numNodes; i++) {
            nodes.push({
                x: Math.random() * width, y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.7, vy: (Math.random() - 0.5) * 0.7,
                energy: Math.random()
            });
        }

        let time = 0;
        function render() {
            time += 0.02;
            ctx.fillStyle = 'rgba(0, 2, 6, 0.25)';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < numNodes; i++) {
                let n1 = nodes[i];
                n1.x += n1.vx; n1.y += n1.vy;
                if (n1.x < 0 || n1.x > width) n1.vx *= -1;
                if (n1.y < 0 || n1.y > height) n1.vy *= -1;

                for (let j = i + 1; j < numNodes; j++) {
                    let n2 = nodes[j];
                    let dx = n2.x - n1.x, dy = n2.y - n1.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 130) {
                        let alpha = (1 - dist / 130);
                        ctx.beginPath();
                        ctx.moveTo(n1.x, n1.y); ctx.lineTo(n2.x, n2.y);
                        ctx.strokeStyle = `rgba(56, 189, 248, ${alpha * 0.5})`;
                        ctx.lineWidth = 0.8; ctx.stroke();
                    }
                }

                ctx.beginPath();
                ctx.arc(n1.x, n1.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(168, 85, 247, ${Math.sin(time + n1.energy * 10) * 0.5 + 0.5})`;
                ctx.fill();
            }

            document.getElementById('flowRate').textContent = `${Math.floor(1000 + Math.sin(time) * 200)} Res/s`;
            requestAnimationFrame(render);
        }
        render();

        function triggerSymbiosis() {
            const input = document.getElementById('intentInput');
            const log = document.getElementById('logBox');
            const orb = document.getElementById('coreOrb');
            const val = input.value.trim();

            if (!val) {
                log.innerHTML = `> [System] 意志を入力してください。`;
                return;
            }

            orb.style.transform = "scale(1.25)";
            orb.style.boxShadow = "0 0 90px rgba(16, 185, 129, 1), inset 0 0 30px rgba(255,255,255,1)";
            
            setTimeout(() => {
                orb.style.transform = "scale(1)";
                orb.style.boxShadow = "0 0 50px rgba(168, 85, 247, 0.8), inset 0 0 20px rgba(255,255,255,0.9)";
            }, 700);

            log.innerHTML = `> [Intent Ingest] 意志受容: "${val}"<br>> [Zero-Settle Stream] 決済発生0。全チェーンAI流動性と自律同調完了。`;
            input.value = "";
        }
    </script>
</body>
</html>
