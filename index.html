<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria - エーテリア生態系</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 呼吸するように拡大縮小・明滅する背景の光 */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(14, 116, 144, 0.05) 60%, transparent 100%);
            border-radius: 50%;
            animation: breathe 8s ease-in-out infinite;
            z-index: 1;
        }

        /* メインの呼吸する円オブジェクト */
        .core-orb {
            position: relative;
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.4);
            animation: breathe 8s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .core-orb::after {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: pulse-ring 8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* 呼吸のアニメーション定義 (吸って、止めて、吐いて、止めるのゆったりしたリズム) */
        @keyframes breathe {
            0%, 100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.25);
                opacity: 1;
                box-shadow: 0 0 80px rgba(56, 189, 248, 0.7), inset 0 0 30px rgba(255, 255, 255, 0.6);
            }
        }

        @keyframes pulse-ring {
            0%, 100% {
                transform: scale(0.95);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.15);
                opacity: 0.8;
            }
        }

        .content {
            position: absolute;
            bottom: 15%;
            text-align: center;
            z-index: 3;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            font-weight: 400;
            color: #f8fafc;
        }

        p {
            font-size: 0.95rem;
            color: #94a3b8;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    
    <div class="core-orb"></div>

    <div class="content">
        <h1>Aetheria</h1>
        <p>生態系リズム — 呼吸中...</p>
    </div>

</body>
</html>
