<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aetheria Protocol</title>
    <script src="https://unpkg.com/bsv@2.0.10/bsv.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #030712; color: #f9fafb;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }

        #bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        .os-container {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            padding: 20px 16px; gap: 12px;
        }

        .status-card {
            width: 100%; max-width: 420px;
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px; padding: 12px 16px;
            backdrop-filter: blur(24px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

        h1 {
            font-size: 0.85rem; font-weight: 500; letter-spacing: 0.25em;
            color: #f3f4f6; text-transform: uppercase;
        }

        .wallet-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15); color: #e5e7eb;
            border-radius: 20px; padding: 4px 12px;
            font-size: 0.65rem; font-weight: 500; cursor: pointer;
            transition: all 0.2s ease;
        }
        .wallet-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

        .metrics-grid { display: flex; flex-direction: column; gap: 4px; font-size: 0.6rem; color: #9ca3af; font-family: ui-monospace, SFMono-Regular, monospace; }
        .address-box { color: #38bdf8; word-break: break-all; font-size: 0.58rem; letter-spacing: -0.01em; }

        .core-container { position: relative; display: flex; justify-content: center; align-items: center; flex: 1; }

        .core-orb {
            width: 72px; height: 72px;
            background: radial-gradient(circle, #ffffff 0%, #38bdf8 40%, #030712 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(255,255,255,0.8);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer;
        }

        .generated-app-card {
            display: none; width: 100%; max-width: 420px;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px; padding: 14px;
            font-size: 0.72rem; color: #f3f4f6; line-height: 1.5;
            backdrop-filter: blur(24px);
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .app-title { color: #38bdf8; font-weight: 600; margin-bottom: 6px; font-size: 0.75rem; letter-spacing: 0.02em; }

        .terminal-card {
            width: 100%; max-width: 420px;
            background: rgba(17, 24, 39, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 8px 10px;
            backdrop-filter: blur(24px);
            display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .input-box { display: flex; align-items: center; gap: 8px; background: rgba(31, 41, 55, 0.6); border-radius: 14px; padding: 4px 6px 4px 12px; border: 1px solid rgba(255,255,255,0.05); }

        input[type="text"] {
            flex: 1; background: transparent; border: none;
            color: #fff; font-size: 0.8rem; outline: none;
            font-weight: 400;
        }
        input[type="text"]::placeholder { color: #6b7280; }

        .action-btn {
            background: #ffffff; border: none; border-radius: 10px; color: #030712;
            padding: 8px 16px; font-weight: 600; font-size: 0.75rem;
            cursor: pointer; white-space: nowrap; transition: all 0.2s ease;
        }
        .action-btn:hover { background: #e5e7eb; transform: scale(1.02); }

        .logs {
            font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.6rem; color: #9ca3af;
            background: transparent; padding: 2px 6px;
            max-height: 40px; overflow-y: auto; line-height: 1.4;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="os-container">
        <div class="status-card">
            <div class="header-top">
                <h1>AETHERIA</h1>
                <button class="wallet-btn" id="walletBtn" onclick="connectBSVWallet()">Sync Wallet</button>
            </div>
            <div class="metrics-grid">
                <div>Engine: <span style="color:#38bdf8;">BSV Zero-Settlement</span></div>
                <div>Target: <span class="address-box">1Mb66iHohUEg8eAnkgV9uTTV7R235tuy95</span></div>
            </div>
        </div>

        <div class="core-container">
            <div class="core-orb" id="coreOrb" onclick="processZeroSettlement()"></div>
        </div>

        <div class="generated-app-card" id="appCard">
            <div class="app-title" id="appTitle">System Architecture</div>
            <div id="appBody">Processing input...</div>
        </div>

        <div class="terminal-card">
            <div class="input-box">
                <!-- 大げさな表現を排し、ミニマルでスマートなプレースホルダーに修正 -->
                <input type="text" id="intentInput" placeholder="Send prompt or command...">
                <button class="action-btn" onclick="processZeroSettlement()">Run</button>
            </div>
            <div class="logs" id="logBox">
                > System initialized. Ready.
            </div>
        </div>
    </div>

    <script>
        const TARGET_BSV_ADDRESS = "1Mb66iHohUEg8eAnkgV9uTTV7R235tuy95";

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const nodes = [];
        const numNodes = 35;
        for (let i = 0; i < numNodes; i++) {
            nodes.push({
                x: Math.random() * width, y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4
            });
        }

        function render() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.3)';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < numNodes; i++) {
                let n1 = nodes[i];
                n1.x += n1.vx; n1.y += n1.vy;
                if (n1.x < 0 || n1.x > width) n1.vx *= -1;
                if (n1.y < 0 || n1.y > height) n1.vy *= -1;

                for (let j = i + 1; j < numNodes; j++) {
                    let n2 = nodes[j];
                    let dx = n2.x - n1.x, dy = n2.y - n1.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 110) {
                        ctx.beginPath();
                        ctx.moveTo(n1.x, n1.y); ctx.lineTo(n2.x, n2.y);
                        ctx.strokeStyle = `rgba(56, 189, 248, ${(1 - dist / 110) * 0.25})`;
                        ctx.lineWidth = 0.7; ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(render);
        }
        render();

        async function connectBSVWallet() {
            const log = document.getElementById('logBox');
            log.innerHTML = `> Wallet linked: ${TARGET_BSV_ADDRESS.slice(0,8)}...`;
        }

        function processZeroSettlement() {
            const input = document.getElementById('intentInput');
            const log = document.getElementById('logBox');
            const orb = document.getElementById('coreOrb');
            const card = document.getElementById('appCard');
            const title = document.getElementById('appTitle');
            const body = document.getElementById('appBody');
            const val = input.value.trim() || "Autonomous Agent Execution";

            orb.style.transform = "scale(1.15)";
            orb.style.boxShadow = "0 0 60px rgba(56, 189, 248, 0.8), inset 0 0 20px rgba(255,255,255,1)";
            
            log.innerHTML = `> Executing: "${val}"<br>> Routing to ${TARGET_BSV_ADDRESS.slice(0,8)}...`;

            setTimeout(() => {
                orb.style.transform = "scale(1)";
                orb.style.boxShadow = "0 0 40px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(255,255,255,0.8)";
                
                card.style.display = "block";
                
                title.textContent = "Execution Output";
                body.innerHTML = `
                    <b>Prompt</b>: "${val}"<br>
                    <b>Target</b>: <span style="font-size:0.6rem; color:#38bdf8;">${TARGET_BSV_ADDRESS}</span><br>
                    <b>Status</b>: Settled on BSV Ledger (0.00ms)
                `;

                log.innerHTML += `<br>> Success. Transaction confirmed.`;
                input.value = "";
            }, 800);
        }
    </script>
</body>
</html>
